<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catálogo — Tu Tio Nutri 🦦📦</title>
<style>
:root{--g:#2e7d32}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f6faf3;color:#222}
header{background:var(--g);color:#fff;text-align:center;padding:14px 10px}
header h1{font-size:20px;margin:6px 0 2px}
header p{font-size:12px;margin:0;opacity:.92;line-height:1.5}
#logo{width:84px;height:84px;border-radius:30%;object-fit:cover;border:3px solid #fff}
.fiscal{font-size:11px}
main{padding:6px 10px;max-width:760px;margin:0 auto}
details.catbox{margin:14px 0}
summary.cat{background:var(--g);color:#fff;border-radius:10px;padding:10px 14px;font-size:15px;font-weight:bold;letter-spacing:.3px;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}
summary.cat::-webkit-details-marker{display:none}
summary.cat .c{font-size:11px;font-weight:normal;opacity:.85}
details.catbox[open] summary.cat{border-radius:10px 10px 0 0;margin-bottom:4px}
.card{background:#fff;border:1px solid #e0e0e0;border-radius:12px;padding:10px 12px;margin:8px 0}
/* Una LÍNEA HORIZONTAL por presentación: [info a la izq] [foto al medio] [controles + y - a la der] */
.linea{display:flex;align-items:center;gap:10px;padding:6px 0}
.linea+.linea{border-top:1px solid #d8c49e}
.linea .info{flex:1;min-width:0}
.linea .info h2{font-size:14px;margin:0 0 2px;line-height:1.2}
.linea .info small{color:#888;font-size:11px}
.linea .foto{width:44px;height:44px;object-fit:cover;border-radius:8px;flex-shrink:0}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:44px;height:44px;border:none;border-radius:50%;background:var(--g);color:#fff;font-size:24px;line-height:1}
.stepper button:disabled{background:#ccc}
.stepper .n{min-width:30px;text-align:center;font-weight:bold;font-size:18px}
.mayor{font-size:11px;color:#1b5e20;margin-top:6px}
.sins{font-size:11px;color:#888;margin-top:6px;font-style:italic}
.bar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:2px solid var(--g);padding:10px;display:flex;gap:8px;align-items:center}
.bar .tot{font-size:16px;font-weight:bold}
.bar button{flex:1;padding:10px;border:none;border-radius:8px;font-weight:bold;color:#fff}
.bar .cop{background:#455a64}.bar .wsp{background:#25D366}
.bar button:disabled{background:#bbb}
/* Buscador + chips de categoría + ordenar: barra pegada arriba (queda visible al scrollear) */
.topbar{position:sticky;top:0;z-index:20;background:#fff;padding:8px 10px;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.topbar input{width:100%;padding:10px 12px;border:2px solid var(--g);border-radius:10px;font-size:15px;box-sizing:border-box}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px}
.chips::-webkit-scrollbar{height:0}
.chip{flex:0 0 auto;white-space:nowrap;padding:6px 12px;border-radius:20px;border:1px solid var(--g);background:#fff;color:var(--g);font-size:12px;font-weight:bold;cursor:pointer}
.chip .cnt{font-weight:normal;opacity:.7}
.chip.activo{background:var(--g);color:#fff}
.orden{font-size:12px;color:#666;padding:6px 0}
.orden button{padding:4px 10px;border-radius:16px;border:1px solid #ccc;background:#fff;font-size:12px;cursor:pointer;margin-left:4px}
.orden button.activo{background:var(--g);color:#fff;border-color:var(--g)}
#sinres{text-align:center;color:#888;padding:24px;font-size:13px}
body{padding-bottom:80px}
/* Carrito flotante: boton + previsualizacion del pedido armado */
#cbtn{position:fixed;right:12px;bottom:88px;z-index:30;width:58px;height:58px;border-radius:50%;background:var(--g);color:#fff;font-size:24px;border:3px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.35);cursor:pointer}
#cbtn .cbn{position:absolute;top:-6px;right:-6px;background:#c62828;color:#fff;font-size:11px;font-weight:bold;border-radius:50%;width:22px;height:22px;line-height:22px;text-align:center;display:none}
#cprev{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50}
.cbox{background:#fff;margin:56px auto 0;max-width:520px;max-height:78vh;overflow:auto;border-radius:14px;padding:14px}
.chead{display:flex;justify-content:space-between;align-items:center;font-weight:bold;font-size:17px;border-bottom:2px solid var(--g);padding-bottom:6px;margin-bottom:4px}
.chead button{border:none;background:#c62828;color:#fff;border-radius:8px;padding:4px 10px;font-size:12px;font-weight:bold;cursor:pointer}
.cit{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #eee;font-size:14px}
.cit .nm{font-weight:bold}
.cit .pr{color:#666;font-size:12px}
.cit .sub{text-align:right;white-space:nowrap;font-weight:bold}
.cit .del{border:none;background:#c62828;color:#fff;border-radius:6px;width:26px;height:26px;font-size:14px;line-height:1;cursor:pointer;flex-shrink:0}
.cit .st{display:flex;align-items:center;gap:6px}
.cit .st button{width:26px;height:26px;border:none;border-radius:50%;background:var(--g);color:#fff;font-size:15px;line-height:1;cursor:pointer}
.cit .st button:disabled{background:#ccc}
.cit .st .n{text-align:center;font-weight:bold;min-width:20px}
.ctot{display:flex;justify-content:space-between;font-size:18px;font-weight:bold;padding:10px 0}
.cvac{text-align:center;color:#888;padding:20px 0;font-size:14px}
.cttl{display:flex;gap:6px}
.chead .cerr{background:#757575}
.cact{display:flex;gap:8px;margin-top:10px}
.cact button{flex:1;padding:12px;border:none;border-radius:8px;font-weight:bold;font-size:14px;color:#fff;cursor:pointer}
.cact .cop{background:#455a64}.cact .wsp{background:#25D366}
.cact button:disabled{background:#bbb}
@media print{.bar,.stepper,.topbar,#cbtn,#cprev{display:none!important} header{-webkit-print-color-adjust:exact;print-color-adjust:exact} body{padding-bottom:0}}
</style></head>

const qty={};
// DATA ahora puede ser una lista de SECCIONES [{title, products:[...]}] o la lista simple vieja (atras-compatible)
function allProducts(){
  if(DATA.length && typeof DATA[0]==='object' && DATA[0].products){
    var a=[]; DATA.forEach(function(s){ s.products.forEach(function(p){ a.push(p); }); }); return a;
  }
  return DATA;
}
// Buscador: normaliza el texto (minúsculas sin tildes) para que "canela" encuentre "Canela Molida"
function norma(s){ return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''); }
function cardHTML(pr){
  // Una LÍNEA horizontal por presentación: [info (nombre+precio)] [foto al medio] [controles + y -]
  let h='<div class="card" data-nombre="'+norma(pr.nombre)+'">';
  if(pr.presentaciones.length===0){ h+='<div class="sins">'+pr.nombre+' — sin presentaciones disponibles.</div></div>'; return h; }
  pr.presentaciones.forEach(function(p, idx){
    const key=pr.id+'_'+p.k; const q=qty[key]||0;
    const desc=p.k==='und'?('Bolsa/Paquete · '+p.undg+' g'):(p.k.toUpperCase());
    const por=(p.k!=='und')?('por '+p.k):'por bolsa';
    // Fila 1: nombre + precio (el 1kg es la base, así "por 1kg" no se lee repetido).
    // Filas 2+: la etiqueta ya trae el peso (500G/250G/Bolsa), así que NO repito "por 500g" (antes salía "500G · S/ 6.00 por 500g").
    const titulo=(idx===0)?('<h2>'+pr.nombre+'</h2><small>S/ '+p.p.toFixed(2)+' '+por+'</small>')
                         :('<small>'+desc+' · S/ '+p.p.toFixed(2)+'</small>');
    // Foto al medio de la línea (columna de 44px); se repite para mantener el alineamiento si hay +1 presentaciones
    const fotoBox=pr.foto?('<img class="foto" src="data:image/jpeg;base64,'+pr.foto+'" alt="">'):('<span class="foto"></span>');
    h+='<div class="linea">'+
       '<div class="info">'+titulo+'</div>'+
       fotoBox+
       '<div class="stepper">'+
       '<button data-inc="'+key+'">+</button>'+
       '<span class="n">'+q+'</span>'+
       '<button '+(q<=0?'disabled':'')+' data-dec="'+key+'">-</button>'+
       '</div>'+
       '</div>';
  });
  if(pr.mayor>0){ h+='<div class="mayor">A partir de '+UMBRAL+' kg, el precio por kilo baja a S/ '+pr.mayor.toFixed(2)+'</div>'; }
  h+='</div>'; return h;
}
// ---------- ESTADO DE VISTA: categoria activa + orden (A-Z / Z-A) ----------
// Los chips de categoria y el boton de orden re-ordenan/re-muestran; el carrito (qty)
// vive en el global, así que cambiar de vista NO pierde el pedido armado.
var catActiva='';   // titulo de categoria; '' = todas
var orden='az';     // 'az' o 'za'

function seccionesDe(){
  // Devuelve la lista de secciones a renderizar (filtrada por catActiva y ordenada por nombre)
  var base=(DATA.length && DATA[0].products) ? DATA : [{titulo:'', products:DATA}];
  base=base.filter(function(s){ return (!catActiva) || (s.titulo===catActiva); });
  base=base.map(function(s){
    var prods=s.products.slice();
    prods.sort(function(a,b){
      return (orden==='za') ? b.nombre.localeCompare(a.nombre,'es') : a.nombre.localeCompare(b.nombre,'es');
    });
    return {titulo:s.titulo, productos:prods, total:s.products.length};
  });
  return base;
}

function render(){
  var h='';
  seccionesDe().forEach(function(sec){
    if(sec.titulo){
      h+='<details class="catbox" open data-cat="'+sec.titulo+'"><summary class="cat"><span class="t">'+sec.titulo+'</span><span class="c">'+sec.total+' productos</span></summary>';
      sec.productos.forEach(function(pr){ h+=cardHTML(pr); });
      h+='</details>';
    } else {
      sec.productos.forEach(function(pr){ h+=cardHTML(pr); });
    }
  });
  document.getElementById('productos').innerHTML=h;
  // Cada boton de + y - recibe su propio listener (el HTML de render es nuevo en cada cambio)
  document.querySelectorAll('button[data-inc]').forEach(function(b){
    b.addEventListener('click', function(){ setQty(b.getAttribute('data-inc'), 1); });
  });
  document.querySelectorAll('button[data-dec]').forEach(function(b){
    b.addEventListener('click', function(){ setQty(b.getAttribute('data-dec'), -1); });
  });
}
function setQty(key, delta){
  const v=(qty[key]||0)+delta;
  if(v<=0){ delete qty[key]; } else { qty[key]=v; }
  // No se reconstruye el catálogo (que perdía el scroll): se actualiza SOLO el numero y el boton
  // menos en su lugar, para que el cliente se quede justo donde pulso.
  updateStepper(key); calc();
}
function updateStepper(key){
  document.querySelectorAll('button[data-inc="'+key+'"]').forEach(function(b){
    const stepper=b.parentElement;
    const n=stepper.querySelector('.n'); if(n){ n.textContent=(qty[key]||0); }
    const decBtn=stepper.querySelector('button[data-dec]'); if(decBtn){ decBtn.disabled=((qty[key]||0)<=0); }
  });
}
function kgsum(pid){
  let s=0;
  allProducts().forEach(function(pr){
    if(pr.id===pid){ pr.presentaciones.forEach(function(p){ if(p.k!=='und'){ s+=(qty[pid+'_'+p.k]||0)*p.kg; } }); }
  });
  return s;
}
function calc(){
  let total=0, und=0;
  allProducts().forEach(function(pr){
    const ks=kgsum(pr.id);
    pr.presentaciones.forEach(function(p){
      const q=qty[pr.id+'_'+p.k]||0;
      if(q>0){
        und++;
        total+=(p.k!=='und' && ks>=UMBRAL && pr.mayor>0) ? (q*p.kg*pr.mayor) : (q*p.p);
      }
    });
  });
  document.getElementById('tot').textContent='S/ '+total.toFixed(2);
  document.getElementById('bco').disabled=(und===0);
  document.getElementById('bwa').disabled=(und===0);
  document.getElementById('bco2').disabled=(und===0);
  document.getElementById('bwa2').disabled=(und===0);
  renderCarrito(); // actualiza el boton flotante y su previsualizacion
}
// ---------- CARRITO FLOTANTE: previsualiza y gestiona el pedido armado ----------
function carritoVacio(){
  // Devuelve [{key, nombre, desc, sub}] de las lineas con cantidad > 0 (mismo orden que calc).
  // key permite controlarlo desde el panel: +, - y eliminar, sin reconstruir el catalogo.
  const lineas=[]; let total=0;
  allProducts().forEach(function(pr){
    const ks=kgsum(pr.id);
    pr.presentaciones.forEach(function(p){
      const q=qty[pr.id+'_'+p.k]||0;
      if(q>0){
        const sub=(p.k!=='und' && ks>=UMBRAL && pr.mayor>0) ? (q*p.kg*pr.mayor) : (q*p.p);
        total+=sub;
        const desc=p.k==='und'?('bolsa de '+p.undg+' g'):p.k;
        lineas.push({key:pr.id+'_'+p.k, nombre:pr.nombre, desc:desc, sub:sub});
      }
    });
  });
  return {lineas:lineas, total:total};
}
function renderCarrito(){
  const c=carritoVacio();
  // Badge del boton flotante: cantidad de lineas en el pedido
  var items=0; allProducts().forEach(function(pr){ pr.presentaciones.forEach(function(p){ var q=qty[pr.id+'_'+p.k]||0; if(q>0){items++;} }); });
  var badge=document.getElementById('cbn');
  badge.textContent=items;
  badge.style.display=(items>0)?'block':'none';
  document.getElementById('bclear').style.display=(items>0)?'':'none';
  // Previsualizacion del panel (solo se ve si esta abierto; no afecta el scroll del catalogo)
  var host=document.getElementById('clista');
  if(c.lineas.length===0){
    host.innerHTML='<div class="cvac">Tu carrito esta vacio.<br>Toca + en los productos para armar tu pedido.</div>';
  } else {
    var h='';
    c.lineas.forEach(function(l){
      var q=qty[l.key]||0;
      h+='<div class="cit">'+
        '<div style="flex:1;min-width:0"><span class="nm">'+l.nombre+'</span><div class="pr">x'+q+' '+l.desc+'</div></div>'+
        '<div class="st">'+
          '<button data-inc="'+l.key+'">+</button>'+
          '<button data-dec="'+l.key+'">-</button>'+
          '<button class="del" data-del="'+l.key+'" title="Eliminar del carrito">✕</button>'+
        '</div>'+
        '<div class="sub">S/ '+l.sub.toFixed(2)+'</div>'+
      '</div>';
    });
    h+='<div class="ctot"><span>TOTAL</span><span>S/ '+c.total.toFixed(2)+'</span></div>';
    host.innerHTML=h;
    // Los controles del panel se enganchan al mismo setQty que el catalogo (actualiza steppers ahi abajo)
    host.querySelectorAll('button[data-inc]').forEach(function(b){
      b.addEventListener('click', function(){ setQty(b.getAttribute('data-inc'), 1); });
    });
    host.querySelectorAll('button[data-dec]').forEach(function(b){
      b.addEventListener('click', function(){ setQty(b.getAttribute('data-dec'), -1); });
    });
    host.querySelectorAll('button[data-del]').forEach(function(b){
      b.addEventListener('click', function(){ delete qty[b.getAttribute('data-del')]; updateStepper(b.getAttribute('data-del')); calc(); });
    });
  }
}
function toggleCarrito(){
  var p=document.getElementById('cprev');
  var abierto=p.style.display==='block';
  p.style.display=abierto?'none':'block';
  if(!abierto){ renderCarrito(); document.body.style.overflow='hidden'; } else { document.body.style.overflow=''; }
}
function vaciarCarrito(){
  // Borra todo el pedido y recalcula (el cliente puede volver a armar desde cero)
  Object.keys(qty).forEach(function(k){ delete qty[k]; });
  calc();
}
function pedidoTexto(){
  const L=['PEDIDO - '+NOMBRE]; let total=0;
  allProducts().forEach(function(pr){
    const ks=kgsum(pr.id);
    pr.presentaciones.forEach(function(p){
      const q=qty[pr.id+'_'+p.k]||0;
      if(q>0){
        const sub=(p.k!=='und' && ks>=UMBRAL && pr.mayor>0) ? (q*p.kg*pr.mayor) : (q*p.p); total+=sub;
        const desc=p.k==='und'?('x'+q+' und de '+p.undg+'g'):('x'+q+' '+p.k);
        L.push(pr.nombre+' || '+desc+' || S/ '+sub.toFixed(2));
      }
    });
  });
  L.push('TOTAL: S/ '+total.toFixed(2));
  return L.join('\n');
}
function copiar(){
  const t=pedidoTexto();
  if(navigator.clipboard){
    navigator.clipboard.writeText(t).then(
      function(){ alert('Pedido copiado\n\n'+t); },
      function(){ prompt('Copia el pedido:', t); }
    );
  } else { prompt('Copia el pedido:', t); }
}
function enviar(){
  const t=pedidoTexto();
  if(WSP){ window.open('https://wa.me/'+WSP+'?text='+encodeURIComponent(t),'_blank'); }
  else { copiar(); alert('No hay numero de WhatsApp configurado en la tienda. Tu pedido quedo copiado (pegalo donde lo pidan).'); }
}
// ---------- CHIPS DE CATEGORIA: se arman solos desde DATA (el "Todas" va primero) ----------
function buildChips(){
  var host=document.getElementById('chips');
  var titulos=[];
  DATA.forEach(function(s){ if(s.products && s.titulo && titulos.indexOf(s.titulo)<0){ titulos.push(s.titulo); } });
  var html='<button class="chip'+(catActiva===''?' activo':'')+'" data-cat="">Todas <span class="cnt">'+allProducts().length+'</span></button>';
  titulos.forEach(function(t){
    var n=0; DATA.forEach(function(s){ if(s.products && s.titulo===t){ n=s.products.length; } });
    html+='<button class="chip'+(catActiva===t?' activo':'')+'" data-cat="'+t+'">'+t+' <span class="cnt">'+n+'</span></button>';
  });
  host.innerHTML=html;
  host.querySelectorAll('.chip').forEach(function(c){
    c.addEventListener('click', function(){ catActiva=c.getAttribute('data-cat'); aplicarVista(); });
  });
}
function aplicarOrden(){
  document.getElementById('ordaz').classList.toggle('activo', orden==='az');
  document.getElementById('ordza').classList.toggle('activo', orden==='za');
}

// ---------- VISTA COMPLETA: categoria + orden + busqueda, combinados ----------
// Re-render por categoria/orden (cambia que se vea), pero la busqueda SOLO oculta tarjetas
// (no reconstruye), para que no se pierda el scroll ni el pedido armado.
function aplicarVista(){
  buildChips(); aplicarOrden();
  render();           // respeta catActiva y orden; qty global conserva el carrito
  filtrar();          // aplica la busqueda vigente (o muestra todo si esta vacia)
}
function filtrar(){
  var q=norma(document.getElementById('buscar').value.trim());
  var hayAlgo=false;
  // Secciones (categorias): oculta las tarjetas que no coinciden y la seccion entera si queda vacia
  document.querySelectorAll('.catbox').forEach(function(sec){
    var vis=0;
    sec.querySelectorAll('.card').forEach(function(card){
      var ok=(q==='') || ((card.getAttribute('data-nombre')||'').indexOf(q)>=0);
      card.style.display=ok?'':'none'; if(ok){vis++;}
    });
    if(vis>0){ sec.open=true; sec.style.display=''; hayAlgo=true; }
    else { sec.open=false; sec.style.display='none'; }
  });
  // Catalogo simple (sin categorias): tarjetas sueltas directo bajo #productos
  document.querySelectorAll('#productos > .card').forEach(function(card){
    var ok=(q==='') || ((card.getAttribute('data-nombre')||'').indexOf(q)>=0);
    card.style.display=ok?'':'none'; if(ok){hayAlgo=true;}
  });
  document.getElementById('sinres').style.display=(q!=='' && !hayAlgo)?'block':'none';
}

// Wire
document.getElementById('buscar').addEventListener('input', filtrar);
document.getElementById('ordaz').addEventListener('click', function(){ orden='az'; aplicarVista(); });
document.getElementById('ordza').addEventListener('click', function(){ orden='za'; aplicarVista(); });

buildChips(); aplicarOrden();
render(); calc();
</script>
